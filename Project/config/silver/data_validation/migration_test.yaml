#
# Normalization rules applied automatically:
#   - Boolean    : TRUE/FALSE -> '1'/'0'
#   - Numeric    : ROUND to 2 decimal places, then text
#   - Timestamp  : 'YYYY-MM-DD HH24:MI:SS'  (microseconds stripped)
