# ============================================================

tables:
  migration_test:
    validations:

      # ── ③ / ④ Normalised data validation (all columns) ───────────
      data_validation:
        source_table_name: migration_test
        source: postgresql
        pksourcecolumn: test_label_normalized
        source_audit_column: 
        sourcequery: |
          SELECT 
            COALESCE(CAST(row_id AS TEXT), '<<NULL>>') AS row_id_normalized,
            COALESCE(CAST(col_varchar AS TEXT), '<<NULL>>') AS col_varchar_normalized,
            COALESCE(CAST(col_text AS TEXT), '<<NULL>>') AS col_text_normalized,
            COALESCE(CAST(TRIM(col_char) AS TEXT), '<<NULL>>') AS col_char_normalized,
            COALESCE(CASE WHEN col_boolean = true THEN '1' WHEN col_boolean = false THEN '0' ELSE NULL END, '<<NULL>>') AS col_boolean_normalized,
            COALESCE(CAST(col_smallint AS TEXT), '<<NULL>>') AS col_smallint_normalized,
            COALESCE(CAST(col_integer AS TEXT), '<<NULL>>') AS col_integer_normalized,
            COALESCE(CAST(col_bigint AS TEXT), '<<NULL>>') AS col_bigint_normalized,
            COALESCE(CAST(col_numeric AS TEXT), '<<NULL>>') AS col_numeric_normalized,
            COALESCE(CAST(col_decimal AS TEXT), '<<NULL>>') AS col_decimal_normalized,
            COALESCE(CAST(col_float AS TEXT), '<<NULL>>') AS col_float_normalized,
            COALESCE(CAST(col_date AS TEXT), '<<NULL>>') AS col_date_normalized,
            COALESCE(TO_CHAR(col_timestamp_ntz, 'YYYY-MM-DD HH24:MI:SS'), '<<NULL>>') AS col_timestamp_ntz_normalized,
            COALESCE(CAST(TO_CHAR(col_timestamp_tz AT TIME ZONE 'UTC', 'YYYY-MM-DD HH24:MI:SS.US') AS TEXT), '<<NULL>>') AS col_timestamp_tz_normalized,
            COALESCE(CAST(UPPER(TRIM(CAST(col_uuid AS TEXT))) AS TEXT), '<<NULL>>') AS col_uuid_normalized,
            COALESCE(CAST(encode(col_bytea, 'hex') AS TEXT), '<<NULL>>') AS col_bytea_normalized,
            COALESCE(CAST((WITH RECURSIVE _jf(path, val) AS (SELECT k, v FROM jsonb_each(col_json::jsonb) AS t(k, v) UNION ALL SELECT   CASE WHEN jsonb_typeof(_jf.val) = 'object' THEN _jf.path || '.' || kv.k        ELSE _jf.path || '[' || kv.k || ']' END,   kv.v FROM _jf, LATERAL (  SELECT key AS k, value AS v FROM jsonb_each(_jf.val) WHERE jsonb_typeof(_jf.val) = 'object'   UNION ALL   SELECT ord::text AS k, v FROM jsonb_array_elements(_jf.val) WITH ORDINALITY AS t(v, ord) WHERE jsonb_typeof(_jf.val) = 'array' ) AS kv(k, v) WHERE jsonb_typeof(_jf.val) IN ('object','array') ) SELECT COALESCE(  CASE WHEN col_json IS NULL THEN NULL        WHEN col_json::jsonb = '{}' THEN '{}'        WHEN col_json::jsonb = '[]'   THEN '[]'        ELSE (         SELECT string_agg(           path || '=' || CASE jsonb_typeof(val)              WHEN 'string'  THEN '"' || (val #>> '{}') || '"'              WHEN 'null'    THEN 'null'              ELSE val::text END,            '|' ORDER BY path)          FROM _jf          WHERE jsonb_typeof(val) NOT IN ('object','array')        ) END, '<<EMPTY>>') ) AS TEXT), '<<NULL>>') AS col_json_normalized,
            COALESCE(CAST((WITH RECURSIVE _jf(path, val) AS (SELECT k, v FROM jsonb_each(col_jsonb::jsonb) AS t(k, v) UNION ALL SELECT   CASE WHEN jsonb_typeof(_jf.val) = 'object' THEN _jf.path || '.' || kv.k        ELSE _jf.path || '[' || kv.k || ']' END,   kv.v FROM _jf, LATERAL (  SELECT key AS k, value AS v FROM jsonb_each(_jf.val) WHERE jsonb_typeof(_jf.val) = 'object'   UNION ALL   SELECT ord::text AS k, v FROM jsonb_array_elements(_jf.val) WITH ORDINALITY AS t(v, ord) WHERE jsonb_typeof(_jf.val) = 'array' ) AS kv(k, v) WHERE jsonb_typeof(_jf.val) IN ('object','array') ) SELECT COALESCE(  CASE WHEN col_jsonb IS NULL THEN NULL        WHEN col_jsonb::jsonb = '{}' THEN '{}'        WHEN col_jsonb::jsonb = '[]'   THEN '[]'        ELSE (         SELECT string_agg(           path || '=' || CASE jsonb_typeof(val)              WHEN 'string'  THEN '"' || (val #>> '{}') || '"'              WHEN 'null'    THEN 'null'              ELSE val::text END,            '|' ORDER BY path)          FROM _jf          WHERE jsonb_typeof(val) NOT IN ('object','array')        ) END, '<<EMPTY>>') ) AS TEXT), '<<NULL>>') AS col_jsonb_normalized,
            COALESCE(CAST((SELECT COALESCE(  CASE WHEN col_hstore IS NULL THEN NULL        WHEN col_hstore = ''::hstore THEN '<<EMPTY>>'        ELSE (         SELECT string_agg(           k || '=' || (v #>> '{}'),            '|' ORDER BY k)          FROM jsonb_each(hstore_to_jsonb(col_hstore)) AS t(k, v)        ) END, '<<EMPTY>>') ) AS TEXT), '<<NULL>>') AS col_hstore_normalized,
            COALESCE(CAST(test_label AS TEXT), '<<NULL>>') AS test_label_normalized
          FROM public.migration_test;
        target_table_name: migration_test
        target: snowflake
        pktargetcolumn: test_label_normalized
        target_audit_column: 
        targetquery: |
          SELECT 
              COALESCE(CAST(ROW_ID AS STRING), '<<NULL>>') AS "row_id_normalized",
              COALESCE(CAST(COL_VARCHAR AS STRING), '<<NULL>>') AS "col_varchar_normalized",
              COALESCE(CAST(COL_TEXT AS STRING), '<<NULL>>') AS "col_text_normalized",
              COALESCE(CAST(TRIM(COL_CHAR) AS STRING), '<<NULL>>') AS "col_char_normalized",
              COALESCE(CASE WHEN COL_BOOLEAN = TRUE THEN '1' WHEN COL_BOOLEAN = FALSE THEN '0' ELSE NULL END, '<<NULL>>') AS "col_boolean_normalized",
              COALESCE(CAST(COL_SMALLINT AS STRING), '<<NULL>>') AS "col_smallint_normalized",
              COALESCE(CAST(COL_INTEGER AS STRING), '<<NULL>>') AS "col_integer_normalized",
              COALESCE(CAST(COL_BIGINT AS STRING), '<<NULL>>') AS "col_bigint_normalized",
              COALESCE(CAST(COL_NUMERIC AS STRING), '<<NULL>>') AS "col_numeric_normalized",
              COALESCE(CAST(COL_DECIMAL AS STRING), '<<NULL>>') AS "col_decimal_normalized",
              COALESCE(CAST(COL_FLOAT AS STRING), '<<NULL>>') AS "col_float_normalized",
              COALESCE(TO_VARCHAR(COL_DATE, 'YYYY-MM-DD'), '<<NULL>>') AS "col_date_normalized",
              COALESCE(TO_VARCHAR(COL_TIMESTAMP_NTZ, 'YYYY-MM-DD HH24:MI:SS'), '<<NULL>>') AS "col_timestamp_ntz_normalized",
              COALESCE(CAST(TO_VARCHAR(CONVERT_TIMEZONE('UTC', COL_TIMESTAMP_TZ), 'YYYY-MM-DD HH24:MI:SS.FF6') AS STRING), '<<NULL>>') AS "col_timestamp_tz_normalized",
              COALESCE(CAST(UPPER(TRIM(CAST(COL_UUID AS STRING))) AS STRING), '<<NULL>>') AS "col_uuid_normalized",
              COALESCE(CAST(LOWER(HEX_ENCODE(COL_BYTEA)) AS STRING), '<<NULL>>') AS "col_bytea_normalized",
              COALESCE(CAST((SELECT LISTAGG(    f.path || '=' ||       CASE WHEN IS_NULL_VALUE(f.value) THEN 'null'            WHEN TYPEOF(f.value) = 'VARCHAR'    THEN '"' || f.value::STRING || '"'            WHEN TYPEOF(f.value) = 'BOOLEAN' THEN f.value::STRING            ELSE f.value::STRING END,     '|') WITHIN GROUP (ORDER BY f.path)  FROM dev_edge_bronze.storedge_fms_public.migration_test AS _flt,    LATERAL FLATTEN(INPUT => PARSE_JSON(CAST(_flt.COL_JSON AS STRING)), RECURSIVE => TRUE) f  WHERE _flt.ROW_ID = dev_edge_bronze.storedge_fms_public.migration_test.ROW_ID    AND TYPEOF(f.value) NOT IN ('OBJECT', 'ARRAY')) AS STRING), '<<NULL>>') AS "col_json_normalized",
              COALESCE(CAST((SELECT LISTAGG(    f.path || '=' ||       CASE WHEN IS_NULL_VALUE(f.value) THEN 'null'            WHEN TYPEOF(f.value) = 'VARCHAR'    THEN '"' || f.value::STRING || '"'            WHEN TYPEOF(f.value) = 'BOOLEAN' THEN f.value::STRING            ELSE f.value::STRING END,     '|') WITHIN GROUP (ORDER BY f.path)  FROM dev_edge_bronze.storedge_fms_public.migration_test AS _flt,    LATERAL FLATTEN(INPUT => PARSE_JSON(CAST(_flt.COL_JSONB AS STRING)), RECURSIVE => TRUE) f  WHERE _flt.ROW_ID = dev_edge_bronze.storedge_fms_public.migration_test.ROW_ID    AND TYPEOF(f.value) NOT IN ('OBJECT', 'ARRAY')) AS STRING), '<<NULL>>') AS "col_jsonb_normalized",
              COALESCE(CAST((SELECT LISTAGG(f.key || '=' || f.value::STRING, '|') WITHIN GROUP (ORDER BY f.key)  FROM dev_edge_bronze.storedge_fms_public.migration_test AS _flt,    LATERAL FLATTEN(INPUT => PARSE_JSON(CAST(_flt.COL_HSTORE AS STRING))) f  WHERE _flt.ROW_ID = dev_edge_bronze.storedge_fms_public.migration_test.ROW_ID) AS STRING), '<<NULL>>') AS "col_hstore_normalized",
              COALESCE(CAST(TEST_LABEL AS STRING), '<<NULL>>') AS "test_label_normalized"
          FROM dev_edge_bronze.storedge_fms_public.migration_test
          WHERE _FIVETRAN_ACTIVE = TRUE;
