version: '1.0'
last_updated: '2026-08-19'
description: 'Column exclusions for the AWS Athena source database type. Every entry
  in this file is applied to BOTH Athena source tables AND their Snowflake target
  counterparts, across all Athena connections/databases.

  '
global_exclusions:
  description: Columns excluded from ALL Athena-sourced tables, source and target
  columns:
  - column_name: _FIVETRAN_DELETED
    reason: Fivetran soft-delete flag - internal metadata
    applies_to:
    - source
    - target
  - column_name: _FIVETRAN_SYNCED
    reason: Fivetran sync timestamp - internal metadata
    applies_to:
    - target
  - column_name: _FIVETRAN_ID
    reason: Fivetran internal row identifier
    applies_to:
    - target
  - column_name: _FIVETRAN_INDEX
    reason: Fivetran array index for nested structures
    applies_to:
    - target
pattern_exclusions:
  description: Exclude columns matching these regex patterns (case-insensitive)
  patterns:
  - pattern: ^_FIVETRAN_.*
    reason: Fivetran internal metadata columns
    applies_to:
    - source
    - target
settings:
  log_exclusions: true
  log_level: INFO
user_global_exclusions:
- column_name: abc
  reason: ahahaja
  applies_to:
  - source
  - target
  added_by: CLI
  date_added: '2026-08-20'
