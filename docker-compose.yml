version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: migration_validator_source_db
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./tests/postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d source_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - migration_network

volumes:
  postgres_data:

networks:
  migration_network:
    driver: bridge
